# Local development profile. Deployments must set AIOJ_ENV=production (or omit
# it): production requires a real JWT_SECRET and disables /api/dev/mail.
environment: "development"
server:
  host: "0.0.0.0"
  port: 8080
  metrics_token: ""   # METRICS_TOKEN; /metrics accepts admin tokens when empty
database:
  host: "localhost"
  port: 5432
  user: "aioj"
  password: "aioj_dev"
  name: "aioj"
  max_open: 25
  max_idle: 5
  replica_dsn: ""   # optional read replica DSN; env DATABASE_REPLICA_DSN
auth:
  jwt_secret: "change-me-in-production"
  access_ttl: 15m
  refresh_ttl: 168h
judge:
  endpoint: "http://localhost:5050"
  concurrency: 4
  max_code_size: 262144
  # Pressure gate: pause new judgments when the host is under resource pressure.
  # Both values default to 0 (disabled). Enable them in production to prevent
  # a burst of Java/Rust submissions from OOM-killing the server.
  #
  # min_free_mem_mb: pause when MemAvailable (/proc/meminfo) drops below this.
  #   Recommended: 512 for a 4 GB server with concurrency ≥ 2.
  #   Set via env: JUDGE_MIN_FREE_MEM_MB
  min_free_mem_mb: 0
  #
  # max_load_per_cpu: pause when (1-min loadavg / numCPU) exceeds this ratio.
  #   1.5 = allow 50% run-queue over-subscription before pausing.
  #   Set via env: JUDGE_MAX_LOAD_PER_CPU
  max_load_per_cpu: 0
redis:
  url: "localhost:6379"
ai:
  enabled: false
  credential_master_key: ""
  worker_concurrency: 2
  job_timeout_seconds: 300
  max_response_bytes: 4194304
  retention_days: 14
  staged_testdata_root: "./testdata/ai-staging"
mail:
  driver: "catcher"          # smtp | catcher | noop — override with MAIL_DRIVER
  host: ""
  port: 587
  username: ""
  password: ""
  from: "noreply@aioj.com"
  public_url: "http://localhost:8081"
lang_dir: "./lang"
# Geolocation / rollout flags (Phase C). Empty allowlist = enabled everywhere.
features:
  remote_bots_regions: []   # e.g. ["BD","US","DE"]
