openapi: 3.0.3
info:
  title: AIOJ API
  version: 0.1.0
  description: |
    AIOJ public HTTP API.

    PARTIAL BY DESIGN, AND HONESTLY SO. This document describes 5 of the 234
    paths the server mounts. It is not the source of truth for the API: the
    router (`internal/api/router_mount_*.go`) and the handlers are, and the
    TypeScript shapes the SPA uses live in `web/src/types/api.ts`.

    The gap is a ratchet, not an oversight. `TestOpenAPICoversTheRouter` in
    `internal/api/` counts the mounted paths this document does not describe
    and fails when that number grows, so an endpoint cannot be added without
    someone deciding whether it belongs here. It can only shrink.

    Client stubs generated from this file cover the documented subset only.
    Treat anything absent as unspecified rather than as unavailable.
servers:
  - url: http://localhost:8081
    description: local dev
tags:
  - name: health
  - name: activity
  - name: rankings
  - name: auth
paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness/readiness (DB, Redis, judge queue)
      responses:
        "200":
          description: OK or degraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded, down] }
                  uptime_sec: { type: number }
        "503":
          description: Database down
  /api/activity:
    get:
      tags: [activity]
      summary: Unified community activity (AC, ratings, comments)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, type, username, title, created_at]
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [ac, rating, comment] }
                        username: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        link: { type: string }
                        created_at: { type: string, format: date-time }
  /api/rankings:
    get:
      tags: [rankings]
      summary: Global / country rankings by rating
      parameters:
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: country, in: query, schema: { type: string } }
        - { name: organization, in: query, schema: { type: string } }
      responses:
        "200":
          description: Ranking page
  /api/auth/login:
    post:
      tags: [auth]
      summary: Password login → access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Tokens
        "401":
          description: Invalid credentials
  /api/submissions:
    post:
      tags: [auth]
      summary: Create submission (Bearer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problem_id, language, source_code]
              properties:
                problem_id: { type: string }
                language: { type: string }
                source_code: { type: string }
                contest_id: { type: string }
      responses:
        "201":
          description: Accepted
  /api/editorials/problem/{problemId}/solution:
    get:
      tags: [editorials]
      summary: Read the problem's official reference solution
      description: >
        Optionally authenticated. A setter on a draft gets claims and reads the
        answer key; a public visitor on a published problem reads it with no token.
        Returns an empty object when no solution has been written yet.
      parameters:
        - { name: problemId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The official reference solution, or empty
    put:
      tags: [editorials]
      summary: Create or update the official reference solution
      description: >
        Writes only solution_code and solution_language onto the official
        editorial, preserving any prose. Shares the row with AI Studio apply.
        Owner, admin, or co-author only.
      security:
        - bearerAuth: []
      parameters:
        - { name: problemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solution_code, solution_language]
              properties:
                solution_code: { type: string }
                solution_language: { type: string }
      responses:
        "200":
          description: Saved
        "403":
          description: Not owner, admin, or co-author
  /api/editorials/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [editorials]
      summary: Edit an editorial
      description: >
        Rewrites the prose and solution fields of one editorial. Does not move it
        to another problem, and does not change is_official — that flag decides who
        may read it, so it is set at creation. Allowed for an admin, the
        editorial's author, or a problem owner/co-author; anyone else gets 404
        rather than 403, so the endpoint cannot be used to probe for ids.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
                approach: { type: string }
                solution_code: { type: string }
                solution_language: { type: string }
                time_complexity: { type: string }
                space_complexity: { type: string }
      responses:
        "200":
          description: Updated editorial
        "400":
          description: Title or content is empty
        "404":
          description: No such editorial, or the caller may not manage it
    delete:
      tags: [editorials]
      summary: Delete an editorial
      description: >
        Removes one editorial. Same ownership rule as the PUT on this path.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: No such editorial, or the caller may not manage it
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
