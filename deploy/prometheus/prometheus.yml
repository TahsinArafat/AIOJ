global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aioj'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'
    # /metrics is authenticated. Prometheus expands ${METRICS_TOKEN} at load
    # time (--config.expand-env), and the backend is given the same value.
    authorization:
      type: Bearer
      credentials: '${METRICS_TOKEN}'
