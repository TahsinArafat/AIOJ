groups:
  - name: aioj
    rules:
      - alert: HighErrorRate
        expr: rate(aioj_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec over 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(aioj_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "p95 latency is {{ $value }}s."

      - alert: ServiceDown
        expr: up{job="aioj"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AIOJ service is down"

      # Phase E SLA: judge latency (p95 judge duration > 5s) and queue backlog
      - alert: JudgeLatencyHigh
        expr: histogram_quantile(0.95, rate(aioj_judge_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 judge latency above 5s (SLA)"
          description: "p95={{ $value }}s — scale judge-worker or inspect queue."

      - alert: JudgeQueueBacklog
        expr: aioj_judge_queue_depth > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Judge queue backlog high"
          description: "Depth={{ $value }} — consider more workers."
