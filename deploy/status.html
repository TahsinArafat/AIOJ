<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="30" />
  <title>AIOJ Status</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem 1.25rem; }
    .ok { border-color: #22c55e; }
    .bad { border-color: #ef4444; }
    #status { font-weight: 700; font-size: 1.25rem; }
    ul { padding-left: 1.2rem; color: #666; }
    @media (prefers-color-scheme: dark) { ul { color: #aaa; } }
    footer { margin-top: 2rem; font-size: 0.8rem; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>AIOJ Status</h1>
  <div class="card" id="card">
    <div id="status">Checking…</div>
    <ul id="components"></ul>
  </div>
  <footer>Auto-refreshes every 30s · source <code>/status</code></footer>
  <script>
    async function check() {
      const statusEl = document.getElementById('status');
      const card = document.getElementById('card');
      const list = document.getElementById('components');
      try {
        const res = await fetch('/api/health', { cache: 'no-store' });
        const data = await res.json();
        const s = data.status || 'unknown';
        statusEl.textContent = s === 'ok' ? 'All systems operational' : s === 'degraded' ? 'Degraded performance' : 'Service disruption';
        card.className = 'card ' + (s === 'down' ? 'bad' : s === 'ok' ? 'ok' : '');
        list.innerHTML = '';
        const comps = data.components || {};
        for (const [k, v] of Object.entries(comps)) {
          const li = document.createElement('li');
          li.textContent = k + ': ' + v.status + (v.error ? ' — ' + v.error : '') + (v.value != null ? ' (' + v.value + ')' : '');
          list.appendChild(li);
        }
        if (data.uptime_sec != null) {
          const li = document.createElement('li');
          li.textContent = 'uptime: ' + Math.floor(data.uptime_sec) + 's';
          list.appendChild(li);
        }
      } catch (e) {
        statusEl.textContent = 'Unable to reach API';
        card.className = 'card bad';
      }
    }
    check();
    setInterval(check, 30000);
  </script>
</body>
</html>
