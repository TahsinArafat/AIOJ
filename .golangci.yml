version: "2"

run:
  timeout: 10m

linters:
  # Everything in the standard set, including the four that matter most for
  # correctness: errcheck (ignored errors), ineffassign (dead assignments),
  # staticcheck (real bugs), unused (dead code).
  #
  # These used to be switched off for the entire tree, which meant a new
  # `_ = doSomething()` or an unchecked error was never reported either. The
  # exclusion below is now a ratchet rather than a blanket switch-off: the
  # existing debt stays quiet, and anything a change *adds* is reported at
  # full strength.
  default: standard
  exclusions:
    paths:
      - Reference_Projects/
      - '.*_test\.go$'
    rules:
      # Deprecated chi.RealIP — intentional until reverse-proxy trust review.
      - linters: [staticcheck]
        text: RealIP
        path: ./

formatters:
  enable:
    - gofmt

issues:
  # The filter used to be `new-from-merge-base: main` unconditionally, and that
  # made the lint job report nothing on the branch it most needed to check.
  # The job runs on push to main as well as on pull requests; on a push to main
  # the merge base of main with itself is HEAD, so the diff is empty and
  # golangci-lint reported "0 issues" by construction.
  #
  # On a pull request the filter means exactly what it says — only what this
  # branch adds — so it stays. On main it is dropped, or the existing debt could
  # never be seen or paid down.
  #
  # Consequence: the real debt belongs to the main build, not the PR build, so
  # the workflow publishes the report on main and ratchets it against a pinned
  # baseline instead of failing outright. Both figures are measured with the
  # versions CI pins — Go 1.26.2, golangci-lint v2.1.6 — via:
  #
  #   GOOS=linux GOARCH=amd64 golangci-lint run --timeout=10m
  #
  # GOOS matters: //go:build files differ by platform, so a darwin run cannot
  # see findings in Linux-only files and under-reports the count CI judges.
  #
  #   with the filter:     0 issues (by construction)
  #   without it:        417 issues
  #                        errcheck 384, staticcheck 16, unused 12, ineffassign 5
  #
  # The toolchain matters more than it looks. A linter built with a newer Go
  # than the module declares reports ~50 bogus `typecheck` errors about stdlib
  # export data, and the total depends on the caps below: the default
  # max-issues-per-linter of 50 hid 334 of the 383 errcheck findings when this
  # was first measured, reporting 83 instead of 417.
  max-issues-per-linter: 0
  max-same-issues: 0
