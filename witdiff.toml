[project]
language = "go"

[verification]
test_command = [
    "go",
    "test",
    "./internal/generate/...",
    "./internal/api/handler/...",
    "-count=1",
]
test_globs = [
    "*_test.go",
    "**/*_test.go",
]
extra_test_paths = []
block_on_integrity_findings = true
max_output_bytes = 16384
targeted_test_selection = false
timeout_secs = 900
flake_repeats = 1
base_dependency_dirs = []
sandbox_env = ["AIOJ_TEST_DSN=postgres://aioj:aioj_dev@localhost:5432/aioj_test?sslmode=disable"]
sandbox_network = true
mutation = false
coverage = false
max_mutants = 25
max_mutants_per_function = 5
framework = "go"
signing_failure_exit_code = 1

[gate]
strict = false
fail_on_no_changed_tests = false
require_signature = false

[policy]
rules = []
ignore_paths = []
