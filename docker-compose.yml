version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aioj
      POSTGRES_USER: aioj
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aioj_secret}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioj"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    privileged: true
    ports:
      - "5050:5050"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:-aioj_secret}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LANG_DIR: /app/lang
      REDIS_URL: ${REDIS_URL:-redis:6379}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/aioj --mode=judge-worker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:-aioj_secret}
      JUDGE_ENDPOINT: http://judge:5050
      REDIS_URL: ${REDIS_URL:-redis:6379}
      LANG_DIR: /app/lang
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
