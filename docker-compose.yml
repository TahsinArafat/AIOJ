services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aioj
      POSTGRES_USER: aioj
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    # Tune memory for small-to-medium servers:
    #   shared_buffers=64MB   — PostgreSQL's own cache (default 128 MB is too
    #                           generous for a single-node judge server)
    #   effective_cache_size  — planner hint; set to ~2× shared_buffers
    #   max_connections=50    — default 100 reserves ~6 MB/conn even when idle;
    #                           backend uses max_open=25 + worker uses max_open=25
    #                           so 50 is the real ceiling with one margin slot
    #   work_mem=4MB          — per-sort/hash memory; keep low to avoid OOM on
    #                           concurrent queries
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=50
      -c work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql
    # Deliberately not published: the database is reachable only on the compose
    # network. Publishing 5432 handed the internet a password-protected port
    # whose default password shipped in this file.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioj"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    privileged: true
    # Only on the internal sandbox network. go-judge's /run accepts arbitrary
    # argv with no authentication, so anything else on the network could ask it
    # to execute code. Before this, it shared the default network with
    # cf-bypass — an unauthenticated headless browser — which meant a
    # compromised browser container had a direct line to the sandbox.
    networks:
      - sandbox
    # go-judge >= 1.11 reads its cgroup parent from /proc/self/cgroup. Docker's
    # default private cgroup namespace rewrites that path to "/", which the
    # binary rejects with "cgroup path is empty" (fatal restart loop). Host
    # namespace is what criyle/go-judge requires for a privileged container.
    cgroup: host
    # No host port: go-judge's /run endpoint executes arbitrary argv with no
    # authentication, and this container is privileged. It is reachable only
    # from the backend/worker services on the compose network.
    expose:
      - "5050"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redisdata:/data
    # Not published: Redis holds the judge queue, so host access let anyone
    # enqueue or drain submissions.
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      # Lean image: Go binary + PostgreSQL client only. No compilers (g++,
      # java, rust, node) because --mode=server never compiles code — only
      # judge-worker containers do. Saves ~600–900 MB RSS vs the full
      # Dockerfile while keeping the full image available for workers.
      dockerfile: Dockerfile.api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JUDGE_ENDPOINT: http://judge:5050
      # Required: a known signing key lets anyone forge an admin token. The
      # backend also validates this at startup and refuses weak values.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      AIOJ_ENV: ${AIOJ_ENV:-production}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in .env}
      LANG_DIR: /app/lang
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://cf-bypass:8191}
      ATCODER_SUBMIT_URL: ${ATCODER_SUBMIT_URL:-http://host.docker.internal:8004}
      MAIL_DRIVER: ${MAIL_DRIVER:-catcher}
      MAIL_FROM: ${MAIL_FROM:-noreply@aioj.com}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-http://localhost:8081}
      # OAuth sign-in. Empty client_id disables the provider, so these are safe
      # to leave blank. The redirect URL must be byte-identical to the one
      # registered in the provider's console, or the provider rejects the
      # exchange with redirect_uri_mismatch. It is derived here rather than in
      # the app because the app's fallback is MAIL_PUBLIC_URL (localhost in a
      # fresh checkout), which would send production users to localhost:8081.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-${PUBLIC_ORIGIN:-http://localhost:8081}/api/auth/oauth/github/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-${PUBLIC_ORIGIN:-http://localhost:8081}/api/auth/oauth/google/callback}
      # AI model management: credential encryption key is required whenever an
      # API key is stored. Generate with: openssl rand -base64 32
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY:-}
      # Declares that the ai-harness container owns the generation queue. The
      # API process then skips its in-process job worker, which would otherwise
      # race the harness for every job via ClaimNext on ai_generation_jobs.
      AI_HARNESS_ENABLED: ${AI_HARNESS_ENABLED:-false}
      # TRUSTED_PROXIES is intentionally unset: the default (loopback + RFC1918)
      # already covers the nginx container, and an explicit empty value would
      # disable X-Forwarded-For trust entirely.
    ports:
      - "8080:8080"
    networks:
      - default
      - sandbox
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    # The API server is Go: very lean. 512 MB is generous headroom; a typical
    # idle server sits under 100 MB. Raise this if you serve heavy traffic or
    # enable the in-process AI worker (AI_ENABLED=true without ai-harness).
    mem_limit: 512m
    restart: unless-stopped

  # Multi-turn AI problem-generation harness.
  #
  # Its own service on purpose: a generation run is token-heavy and takes
  # minutes, so mixing it into the API process would let one long run compete
  # with request handling. It shares the testdata volume (that is where
  # materialized cases land) and talks to go-judge directly, never executing
  # generated code in this container.
  #
  # Started only with an explicit profile, because it needs a configured AI
  # model and a credential master key:
  #   docker compose --profile ai up -d ai-harness
  ai-harness:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=ai-harness
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      AIOJ_ENV: ${AIOJ_ENV:-production}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_HARNESS_ENABLED: ${AI_HARNESS_ENABLED:-false}
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY:-}
      AI_MAX_CASE_N: ${AI_MAX_CASE_N:-1000000}
      AI_MAX_JOB_BYTES: ${AI_MAX_JOB_BYTES:-67108864}
      AI_STAGED_TESTDATA_ROOT: /app/testdata/ai-staging
    networks:
      - default
      - sandbox
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=judge-worker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      AIOJ_ENV: ${AIOJ_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      LANG_DIR: /app/lang
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
      # Pressure gate: hold new judgments when the host is under RAM or CPU
      # pressure. These defaults are conservative — a Java compile spike is
      # ~400 MB, so 512 MB headroom means the server must have that free before
      # another slot is released. Set to 0 to disable each check individually.
      JUDGE_MIN_FREE_MEM_MB: ${JUDGE_MIN_FREE_MEM_MB:-512}
      JUDGE_MAX_LOAD_PER_CPU: ${JUDGE_MAX_LOAD_PER_CPU:-1.5}
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
    networks:
      - default
      - sandbox
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    # Judge-worker compiles and runs code. Memory budget per worker:
    #   - C/C++: ~50–100 MB per concurrent slot
    #   - Python/Node: ~50–80 MB
    #   - Java (javac + JVM): ~300–500 MB per concurrent slot ← the spike
    #   - Rust (rustc): ~200–400 MB during compilation
    # With concurrency=4 and all Java: 4 × 500 MB = 2 GB worst-case.
    # Set concurrency=2 (JUDGE_CONCURRENCY env) on servers with ≤4 GB RAM.
    mem_limit: 2g
    restart: unless-stopped

  frontend:
    build:
      # Repo root, not ./web: the build compiles the legal documents from
      # internal/api/handler/legal so the static policy pages and the API serve
      # the same text. .dockerignore keeps node_modules/dist out of the context.
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the prerendered legal pages as canonical/og:url.
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      # Loopback only: metrics expose usernames, endpoints and traffic shape.
      - "127.0.0.1:9090:9090"
    environment:
      # Scrapes authenticate with this token (see prometheus.yml).
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in .env}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--config.expand-env'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous viewer access was enabled here; that published every dashboard
      # to the host network. Grafana now requires its admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
    restart: unless-stopped

  # =====================================================================
  # VIRTUAL JUDGE BROWSER SERVICES  (profile: vjudge)
  # =====================================================================
  # These three services each run a full headless Chromium + Xvfb virtual
  # framebuffer. At idle each consumes 200–400 MB RSS — together they add
  # ~700 MB–1.2 GB doing nothing. Gate them under the 'vjudge' profile so
  # they don't start unless you actually need Codeforces/AtCoder virtual
  # judging:
  #
  #   docker compose --profile vjudge up -d   # start with vJudge browsers
  #   docker compose up -d                    # start without (saves ~1 GB)
  #
  # cf-bypass: FlareSolverr headless Chromium (Cloudflare cookie harvester)
  cf-bypass:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["vjudge"]
    ports:
      # Loopback only: this is an unauthenticated headless browser.
      - "127.0.0.1:8191:8191"
    environment:
      LOG_LEVEL: info
    mem_limit: 512m
    restart: unless-stopped

  # cf-submit: cloakbrowser (Chromium) submit service for Codeforces
  cf-submit:
    build:
      context: ./deploy/cf-submit
      dockerfile: Dockerfile
    profiles: ["vjudge"]
    network_mode: host
    environment:
      - PORT=8003
      - CF_PROXY=${CF_PROXY:-}
    mem_limit: 768m
    restart: unless-stopped

  # atcoder-submit: cloakbrowser submit service for AtCoder
  atcoder-submit:
    build:
      context: ./deploy/atcoder-submit
      dockerfile: Dockerfile
    profiles: ["vjudge"]
    ports:
      # Loopback only: the submit service accepts remote-site credentials and
      # has no authentication of its own.
      - "127.0.0.1:8004:8004"
    environment:
      - PORT=8004
    mem_limit: 512m
    restart: unless-stopped

  # =====================================================================
  # PRODUCTION: Caddy Reverse Proxy (HTTPS / SSL)
  # =====================================================================
  # Only starts when you run: docker compose --profile production up -d
  # Before using: (1) point your domain DNS to this server's IP
  #               (2) edit deploy/Caddyfile → replace "yourdomain.com"
  #               (3) comment out "80:80" under the frontend service above
  #               (4) ensure ports 80 & 443 are open in firewall
  #               (5) run: docker compose --profile production up -d
  # Caddy auto-obtains & renews Let's Encrypt SSL - zero maintenance.
  # =====================================================================
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - production

networks:
  # Internal-only network for the code-execution boundary. `internal: true`
  # means Docker installs no gateway route, so a container here cannot reach
  # the internet and nothing outside the listed services can reach in.
  #
  # judge lives here (and nowhere else); backend / judge-worker / ai-harness
  # join it in addition to the default network so they can call JUDGE_ENDPOINT.
  # Every other service — notably the unauthenticated cf-bypass browser — stays
  # off it.
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
  testdata:
  promdata:
  grafdata:
  caddy_data:
  caddy_config:
  backups:
