version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aioj
      POSTGRES_USER: aioj
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aioj_secret}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioj"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    privileged: true
    ports:
      - "5050:5050"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:-aioj_secret}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LANG_DIR: /app/lang
      REDIS_URL: ${REDIS_URL:-redis:6379}
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
    ports:
      - "8080:8080"
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=judge-worker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:-aioj_secret}
      JUDGE_ENDPOINT: http://judge:5050
      REDIS_URL: ${REDIS_URL:-redis:6379}
      LANG_DIR: /app/lang
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    restart: unless-stopped

  cf-bypass:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
    restart: unless-stopped

  cf-submit:
    build:
      context: ./deploy/cf-submit
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - FLARESOLVERR_URL=http://cf-bypass:8191
      - CF_PROXY=${CF_PROXY:-}
    depends_on:
      - cf-bypass
    restart: unless-stopped

  # =====================================================================
  # PRODUCTION: Caddy Reverse Proxy (HTTPS / SSL)
  # =====================================================================
  # Only starts when you run: docker compose --profile production up -d
  # Before using: (1) point your domain DNS to this server's IP
  #               (2) edit deploy/Caddyfile → replace "yourdomain.com"
  #               (3) comment out "80:80" under the frontend service above
  #               (4) ensure ports 80 & 443 are open in firewall
  #               (5) run: docker compose --profile production up -d
  # Caddy auto-obtains & renews Let's Encrypt SSL - zero maintenance.
  # =====================================================================
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
  testdata:
  promdata:
  grafdata:
  caddy_data:
  caddy_config:
