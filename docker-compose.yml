services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aioj
      POSTGRES_USER: aioj
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    # Deliberately not published: the database is reachable only on the compose
    # network. Publishing 5432 handed the internet a password-protected port
    # whose default password shipped in this file.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioj"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    privileged: true
    # go-judge >= 1.11 reads its cgroup parent from /proc/self/cgroup. Docker's
    # default private cgroup namespace rewrites that path to "/", which the
    # binary rejects with "cgroup path is empty" (fatal restart loop). Host
    # namespace is what criyle/go-judge requires for a privileged container.
    cgroup: host
    # No host port: go-judge's /run endpoint executes arbitrary argv with no
    # authentication, and this container is privileged. It is reachable only
    # from the backend/worker services on the compose network.
    expose:
      - "5050"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redisdata:/data
    # Not published: Redis holds the judge queue, so host access let anyone
    # enqueue or drain submissions.
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JUDGE_ENDPOINT: http://judge:5050
      # Required: a known signing key lets anyone forge an admin token. The
      # backend also validates this at startup and refuses weak values.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      AIOJ_ENV: ${AIOJ_ENV:-production}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in .env}
      LANG_DIR: /app/lang
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://cf-bypass:8191}
      ATCODER_SUBMIT_URL: ${ATCODER_SUBMIT_URL:-http://host.docker.internal:8004}
      MAIL_DRIVER: ${MAIL_DRIVER:-catcher}
      MAIL_FROM: ${MAIL_FROM:-noreply@aioj.com}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-http://localhost:8081}
      # TRUSTED_PROXIES is intentionally unset: the default (loopback + RFC1918)
      # already covers the nginx container, and an explicit empty value would
      # disable X-Forwarded-For trust entirely.
    ports:
      - "8080:8080"
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    restart: unless-stopped

  # Multi-turn AI problem-generation harness.
  #
  # Its own service on purpose: a generation run is token-heavy and takes
  # minutes, so mixing it into the API process would let one long run compete
  # with request handling. It shares the testdata volume (that is where
  # materialized cases land) and talks to go-judge directly, never executing
  # generated code in this container.
  #
  # Started only with an explicit profile, because it needs a configured AI
  # model and a credential master key:
  #   docker compose --profile ai up -d ai-harness
  ai-harness:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=ai-harness
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      AIOJ_ENV: ${AIOJ_ENV:-production}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_HARNESS_ENABLED: ${AI_HARNESS_ENABLED:-false}
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY:-}
      AI_MAX_CASE_N: ${AI_MAX_CASE_N:-1000000}
      AI_MAX_JOB_BYTES: ${AI_MAX_JOB_BYTES:-67108864}
      AI_STAGED_TESTDATA_ROOT: /app/testdata/ai-staging
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=judge-worker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      AIOJ_ENV: ${AIOJ_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      LANG_DIR: /app/lang
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
    volumes:
      - testdata:/app/testdata
      - ./lang:/app/lang
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      # Loopback only: metrics expose usernames, endpoints and traffic shape.
      - "127.0.0.1:9090:9090"
    environment:
      # Scrapes authenticate with this token (see prometheus.yml).
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in .env}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--config.expand-env'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous viewer access was enabled here; that published every dashboard
      # to the host network. Grafana now requires its admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
    restart: unless-stopped

  cf-bypass:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      # Loopback only: this is an unauthenticated headless browser.
      - "127.0.0.1:8191:8191"
    environment:
      LOG_LEVEL: info
    restart: unless-stopped

  cf-submit:
    build:
      context: ./deploy/cf-submit
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - PORT=8003
      - CF_PROXY=${CF_PROXY:-}
    restart: unless-stopped

  atcoder-submit:
    build:
      context: ./deploy/atcoder-submit
      dockerfile: Dockerfile
    ports:
      # Loopback only: the submit service accepts remote-site credentials and
      # has no authentication of its own.
      - "127.0.0.1:8004:8004"
    environment:
      - PORT=8004
    restart: unless-stopped

  # =====================================================================
  # PRODUCTION: Caddy Reverse Proxy (HTTPS / SSL)
  # =====================================================================
  # Only starts when you run: docker compose --profile production up -d
  # Before using: (1) point your domain DNS to this server's IP
  #               (2) edit deploy/Caddyfile → replace "yourdomain.com"
  #               (3) comment out "80:80" under the frontend service above
  #               (4) ensure ports 80 & 443 are open in firewall
  #               (5) run: docker compose --profile production up -d
  # Caddy auto-obtains & renews Let's Encrypt SSL - zero maintenance.
  # =====================================================================
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
  testdata:
  promdata:
  grafdata:
  caddy_data:
  caddy_config:
  backups:
