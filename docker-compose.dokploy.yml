# AIOJ — Dokploy-optimized Compose
# =================================
# Use THIS file in Dokploy (Compose -> docker-compose.dokploy.yml).
# Dokploy's Traefik is the ONLY public entrypoint (80/443). Do NOT also run
# the Caddy service from docker-compose.yml — it would fight Traefik for 80/443.
#
# What changed vs docker-compose.yml (optimizations for Dokploy/Traefik):
#   1. No host `ports:` at all. Dokploy/Traefik routes to the container port
#      via Docker labels, so nothing is published directly on the host.
#   2. Routing is done by a Dokploy UI domain on `frontend`:80 (Host
#      <your-domain>, HTTPS/Let's Encrypt). No hand-written Traefik router
#      labels -- a stale `${DOMAIN}` there silently 404s the whole site.
#      backend/postgres/redis/judge stay internal-only (expose / sandbox net).
#   2b. `frontend` joins the external `dokploy-network` so Traefik can reach
#      it. Compose stacks must do this explicitly (Dokploy Applications get it
#      automatically). Without it: 404 with a healthy nginx.
#   3. Monitoring (prometheus/grafana) moved behind the `monitor` profile so
#      a fresh Dokploy deploy does not spend RAM on them.
#   4. vjudge browsers + ai-harness stay behind their profiles (off by default).
#   5. The `seeder` runs AUTOMATICALLY on every deploy and creates the first
#      admin from SEED_ADMIN_PASSWORD (skips cleanly when unset). No terminal
#      or `docker compose run` needed.
#   6. Healthchecks + restart + mem limits + json-file log rotation.
#
# Required Dokploy Environment Variables (set in Dokploy UI, NOT committed):
#   DOMAIN                 your public domain, e.g. aioj0.cyou — MUST match the
#                          Dokploy UI domain exactly (used for links/OAuth, and
#                          any Traefik label you add by hand)
#   DB_PASSWORD            openssl rand -hex 32
#   JWT_SECRET             openssl rand -hex 32   (>=32 chars, else backend exits)
#   REDIS_PASSWORD         openssl rand -hex 32
#   METRICS_TOKEN          openssl rand -hex 32
#   CSRF_SECRET            openssl rand -hex 32
#   OAUTH_STATE_SECRET     openssl rand -hex 32
#   SEED_ADMIN_USERNAME    first admin username (default: ai)
#   SEED_ADMIN_PASSWORD    password for the first admin. Must be >=12 chars with
#                          upper + lower + digit + symbol, else the API rejects
#                          the registration and no admin is created.
#   SEED_ADMIN_RESET_PASSWORD  default true: SEED_ADMIN_PASSWORD is
#                          authoritative for the bootstrap admin, so a stale
#                          hash is repaired on deploy. false = never rewrite.
#   PUBLIC_ORIGIN          https://<DOMAIN>
#   MAIL_PUBLIC_URL        https://<DOMAIN>
#   MAIL_DRIVER/MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD/MAIL_FROM
#   PAPER_CERT_EMAIL       Let's Encrypt email for Traefik (if not set globally)
#
# Deploy:
#   1. Dokploy -> Compose -> select this file -> set env vars -> Deploy
#   2. The first admin is created by the `seeder` service during that same
#      deploy — no terminal needed. Log in with SEED_ADMIN_USERNAME /
#      SEED_ADMIN_PASSWORD, then change the password in the UI.
#      SEED_ADMIN_PASSWORD is authoritative for that bootstrap admin: if the
#      account exists with a different (stale) password, the deploy repairs the
#      hash. Log in with SEED_ADMIN_USERNAME / SEED_ADMIN_PASSWORD.
#   3. Optional profiles:
#        --profile ai       -> ai-harness (AI problem generation)
#        --profile vjudge   -> cf-bypass / cf-submit / atcoder-submit (heavy, +1GB)
#        --profile monitor  -> prometheus + grafana
#
# Notes:
#   - Migrations run automatically on backend startup (cmd/aioj: m.Up()).
#     No manual `make migrate-up` needed.
#   - `judge` needs privileged + cgroup:host (criyle/go-judge >=1.11). Keep it.
#   - DNS: A record for DOMAIN -> VPS IP before first deploy (Let's Encrypt).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aioj
      POSTGRES_USER: aioj
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Dokploy env}
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=50
      -c work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioj"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    privileged: true
    cgroup: host
    networks:
      - sandbox
    expose:
      - "5050"
    environment:
      # File store MUST NOT live on /dev/shm. go-judge defaults ES_DIR to
      # /dev/shm/go-judge, which Docker caps at 64 MB of tmpfs. Every judgment
      # caches a compiled artifact there (CopyOutCached) and AIOJ never deletes
      # them, so after ~60-120 submissions the store filled and every subsequent
      # copyOut died with:
      #
      #   copyout: failed to copy content for "spj": write
      #   /dev/shm/go-judge/UCZEIFWP: no space left on device
      #
      # On disk a leak costs disk instead of RAM. /dev/shm is tmpfs, so leaked
      # artifacts there permanently hold host memory.
      ES_DIR: /var/lib/go-judge
      # MANDATORY, not optional: go-judge only installs its shutdown cleanup
      # (newFileStore's cleanUp -> os.RemoveAll) when ES_DIR is left at its
      # default. Setting ES_DIR explicitly makes this TTL the ONLY reclamation
      # path, so without it the store grows forever. It is also why restarting
      # the container "fixed" a full store — restart is the one thing that ever
      # ran that cleanup.
      #
      # Must exceed JUDGE_JUDGMENT_TIMEOUT_SECONDS (600s) or a long judgment
      # loses its artifact mid-run. 20m also clears DefaultStaleClaimAfter (15m).
      ES_FILE_TIMEOUT: 20m
    volumes:
      - judgedata:/var/lib/go-judge
    # go-judge no longer stores files here, but the sandbox still uses shm.
    # 128m is headroom, not a limit on judged code — problem memory limits are
    # enforced per-sandbox by cgroups and are unrelated to this value.
    shm_size: 128m

    # Without a healthcheck `restart: unless-stopped` can never fire: Docker only
    # restarts a container that has *exited*, and a wedged sandbox has not — it is
    # still running, just not answering. That is why a judge that stopped
    # compiling needed a human to restart it.
    #
    # /version is the right probe rather than /run: it is served unconditionally
    # and mounted before the optional auth-token middleware, so it tests "is this
    # server alive" without executing anything. A /run probe would need a real
    # command, a sandbox slot, and would fail for reasons that are not liveness —
    # which would restart the judge whenever the host was merely busy.
    #
    # go-judge is a Go binary that serves HTTP with no TLS, so /version must be
    # fetched inside the container: the image has no wget/curl, and installing one
    # only for a probe adds a package to a privileged image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "http://127.0.0.1:5050/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Dokploy env}"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIOJ_ENV: ${AIOJ_ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Dokploy env}
      JUDGE_ENDPOINT: http://judge:5050
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in Dokploy env (openssl rand -hex 32)}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET must be set in Dokploy env}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in Dokploy env}
      LANG_DIR: /app/lang
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Dokploy env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN:?DOMAIN must be set in Dokploy env}}
      MAIL_DRIVER: ${MAIL_DRIVER:-noop}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@${DOMAIN:?DOMAIN must be set in Dokploy env}}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-https://${DOMAIN:?DOMAIN must be set in Dokploy env}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-https://${DOMAIN:?DOMAIN must be set in Dokploy env}/api/auth/oauth/github/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://${DOMAIN:?DOMAIN must be set in Dokploy env}/api/auth/oauth/google/callback}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_HARNESS_ENABLED: ${AI_HARNESS_ENABLED:-false}
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY:-}
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://cf-bypass:8191}
      ATCODER_SUBMIT_URL: ${ATCODER_SUBMIT_URL:-http://host.docker.internal:8004}
    expose:
      - "8080"
    networks:
      - default
      - sandbox
    volumes:
      - testdata:/app/testdata
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  judge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=judge-worker
    environment:
      AIOJ_ENV: ${AIOJ_ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Dokploy env}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in Dokploy env}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Dokploy env}
      LANG_DIR: /app/lang
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      JUDGE_MIN_FREE_MEM_MB: ${JUDGE_MIN_FREE_MEM_MB:-512}
      JUDGE_MAX_LOAD_PER_CPU: ${JUDGE_MAX_LOAD_PER_CPU:-1.5}
      # Admission is requirement-aware, not just a flat floor: a judgment is
      # dispatched only when free RAM covers its own limit (after the language
      # multiplier) plus this headroom. The old flat 512 MB floor would admit a
      # 2 GB judgment into 600 MB of free memory.
      JUDGE_MEM_HEADROOM_MB: ${JUDGE_MEM_HEADROOM_MB:-256}
      # Largest per-judgment requirement this host will attempt. A submission
      # above it is failed immediately with an explanatory verdict instead of
      # waiting in the queue for memory that can never be free. Must exceed the
      # biggest problem limit you support AFTER the language multiplier (Java's
      # is 2.0). 3072 admits a 2 GB problem and rejects a 2 GB Java one, which
      # would need 4096 — use a language_limits memory_limit_kb override for that.
      JUDGE_MAX_JUDGMENT_MEM_MB: ${JUDGE_MAX_JUDGMENT_MEM_MB:-3072}
      # Bound one submission, so a wedged sandbox cannot hold a slot forever.
      JUDGE_JUDGMENT_TIMEOUT_SECONDS: ${JUDGE_JUDGMENT_TIMEOUT_SECONDS:-600}
      JUDGE_HEALTH_ADDR: ${JUDGE_HEALTH_ADDR:-:8081}
      CF_SUBMIT_URL: ${CF_SUBMIT_URL:-http://host.docker.internal:8003}
    networks:
      - default
      - sandbox
    volumes:
      - testdata:/app/testdata
    depends_on:
      postgres:
        condition: service_healthy
    # This healthcheck is what turns `restart: unless-stopped` from decoration
    # into recovery. Docker only restarts an *exited* container; a worker wedged
    # on a stuck judgment is still running, so without a probe that fails on
    # stalled work the restart policy can never fire — which is exactly why the
    # judge needed a manual restart whenever it stopped compiling.
    #
    # wget is BusyBox's, already present in this Alpine-based image (the backend
    # healthcheck above uses the same tool). The endpoint answers 503 once a
    # judgment outlives the deadline that should have failed it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Long enough that start-up migrations and the first sweep are not counted
      # as a stall.
      start_period: 60s
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      # Repo root, not ./web: the build compiles the legal documents from
      # internal/api/handler/legal so the static policy pages and the API serve
      # the same text. .dockerignore keeps node_modules/dist out of the context.
      context: .
      dockerfile: web/Dockerfile
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
    expose:
      - "80"
    # CRITICAL (Dokploy): Traefik lives on `dokploy-network`. Without joining
    # it, Traefik sees the container via the Docker API but has no reachable
    # IP for it -> 404. This is how Dokploy Applications (e.g. Sleepy/dashboard)
    # work: Dokploy attaches the container to dokploy-network automatically.
    # Compose stacks must do it explicitly. Keep `default` too so nginx can
    # still reach backend:8080.
    networks:
      - default
      - dokploy-network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      # ---------------------------------------------------------------------
      # ROUTING IS OWNED BY DOKPLOY, NOT BY THIS FILE.
      # ---------------------------------------------------------------------
      # Do not hand-write `traefik.http.routers.*` labels here. Set the domain
      # in the Dokploy UI instead:  Compose -> aioj -> frontend -> Domains ->
      # Host `aioj0.cyou`, Path `/`, Port `80`, HTTPS on.
      #
      # Why: hand-written labels interpolate `${DOMAIN}` at deploy time. If
      # DOMAIN is stale (e.g. the template default `aioj.example.com`), the
      # router becomes `Host(aioj.example.com)` while you visit `aioj0.cyou`,
      # and Traefik answers 404 -- with a perfectly healthy nginx container.
      # Dokploy's UI domains are generated from what you actually typed, and
      # are the same mechanism the working Dokploy Applications use.
      #
      # `enable` + `docker.network` are kept: they only tell Traefik which
      # container to look at and which network to read its IP from.
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

  # -------------------------------------------------------------------------
  # First-admin + demo problem seeder. Runs AUTOMATICALLY on every deploy.
  #
  # It used to sit behind `profiles: ["seed"]`, which meant a normal Dokploy
  # deploy never created the first admin: the only account on a fresh database
  # was the migration-seeded `admin` / `admin_secret`, and logging in as
  # SEED_ADMIN_USERNAME returned 401 because that row did not exist. A profile
  # also required `docker compose run`, which is not always reachable from a
  # hosted Dokploy panel. It now runs itself.
  #
  # Two safety properties make "run on every deploy" safe:
  #   1. It is gated on SEED_ADMIN_PASSWORD. Unset -> the container logs that
  #      it skipped and exits 0, so a stack without a seed password still
  #      deploys normally (it must not be a required `${...:?}` variable here,
  #      or a missing value would abort the whole compose file).
  #   2. It is idempotent, and SEED_ADMIN_RESET_PASSWORD defaults to TRUE: the
  #      env password is authoritative for the first admin. A matching password
  #      is a no-op, so this only fires when the stored hash is stale — the
  #      "invalid credentials on a user that exists" case — which makes the
  #      seeded env the single source of truth for the bootstrap account.
  #      Set SEED_ADMIN_RESET_PASSWORD=false to invert that: the seeder then
  #      reports the mismatch instead of repairing it, and a password changed
  #      in the UI survives deploys.
  #
  # Env: SEED_ADMIN_USERNAME (default ai), SEED_ADMIN_PASSWORD (>=12 chars with
  #      upper+lower+digit+symbol), SEED_ADMIN_RESET_PASSWORD (default true),
  #      SEED_PROBLEM_SLUG (default hello).
  # -------------------------------------------------------------------------
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$SEED_ADMIN_PASSWORD" ]; then
          echo 'seed: SEED_ADMIN_PASSWORD not set — skipping first-admin bootstrap'
          exit 0
        fi
        exec /app/seed
    environment:
      AIOJ_ENV: production
      BACKEND_URL: http://backend:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Dokploy env}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-ai}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_RESET_PASSWORD: ${SEED_ADMIN_RESET_PASSWORD:-true}
      SEED_PROBLEM_SLUG: ${SEED_PROBLEM_SLUG:-hello}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # -------------------------------------------------------------------------
  # Optional profiles (off by default to save RAM on Dokploy)
  # -------------------------------------------------------------------------
  ai-harness:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: /app/aioj --mode=ai-harness
    environment:
      AIOJ_ENV: ${AIOJ_ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aioj
      DB_USER: aioj
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in Dokploy env}
      JUDGE_ENDPOINT: http://judge:5050
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in Dokploy env}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_HARNESS_ENABLED: "true"
      AI_CREDENTIAL_MASTER_KEY: ${AI_CREDENTIAL_MASTER_KEY:?AI_CREDENTIAL_MASTER_KEY required for ai profile}
      AI_STAGED_TESTDATA_ROOT: /app/testdata/ai-staging
    networks:
      - default
      - sandbox
    volumes:
      - testdata:/app/testdata
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_started
    restart: unless-stopped

  cf-bypass:
    profiles: ["vjudge"]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    expose:
      - "8191"
    mem_limit: 512m
    restart: unless-stopped

  cf-submit:
    profiles: ["vjudge"]
    build:
      context: ./deploy/cf-submit
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - PORT=8003
      - CF_PROXY=${CF_PROXY:-}
    mem_limit: 768m
    restart: unless-stopped

  atcoder-submit:
    profiles: ["vjudge"]
    build:
      context: ./deploy/atcoder-submit
      dockerfile: Dockerfile
    expose:
      - "8004"
    environment:
      - PORT=8004
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    profiles: ["monitor"]
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    expose:
      - "9090"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in Dokploy env}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--config.expand-env"
    restart: unless-stopped

  grafana:
    profiles: ["monitor"]
    image: grafana/grafana:latest
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafdata:/var/lib/grafana
    expose:
      - "3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set (monitor profile)}
    restart: unless-stopped

networks:
  sandbox:
    internal: true
  # Traefik (Dokploy) network — external, created/managed by Dokploy.
  # Containers not on it are invisible to the router (→ 404).
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  testdata:
  judgedata:
  promdata:
  grafdata:
  backups:
