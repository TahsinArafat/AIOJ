name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Scoped to first-party packages: the module root also contains
      # web/node_modules, and ./... walks into third-party Go files there.
      - name: Test
        run: go test ./cmd/... ./internal/... -count=1
