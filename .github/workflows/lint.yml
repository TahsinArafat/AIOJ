name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=10m
          # No .golangci.yml in repo: use action defaults + timeouts above.

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Pre-existing debt (~600 no-explicit-any / hooks rules). Report without
      # failing the PR until a dedicated cleanup pass ratchets the count down.
      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: ESLint summary
        if: always()
        run: |
          echo "ESLint debt is non-blocking for now (see Phase B plan)."
          echo "Ratchet: fail CI when error count drops below a fixed threshold."
