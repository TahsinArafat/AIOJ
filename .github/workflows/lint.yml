name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # MEASURED, not estimated: the number of findings on main at the commit that
  # introduced this ratchet (Go 1.26.2, golangci-lint v2.1.6).
  #
  # It exists because the linters were, in practice, never run against main:
  # .golangci.yml scoped issues to `new-from-merge-base: main`, and on a push to
  # main that merge base is HEAD, so the diff is empty and the job reported
  # "0 issues" by construction. Without the filter the commit before this one
  # reported 417 — errcheck 383, staticcheck 17, unused 12, ineffassign 5 — of
  # which the staticcheck one in admin_bot_accounts.go is fixed here, leaving
  # 416. That figure is darwin/arm64; see the GOOS note below.
  #
  # MEASURE WITH GOOS=linux. The count is not the same on every platform, because
  # //go:build files differ: internal/judge/pressure/sampler_linux.go exists only
  # on Linux, and its `defer f.Close()` was the 417th finding here while a darwin
  # run reported 416 and could never see it. Measuring on the laptop therefore
  # under-reports by however much platform-specific code adds, and the ratchet
  # fails on the next commit that touches nothing at all:
  #
  #   GOOS=linux GOARCH=amd64 golangci-lint run --timeout=10m
  #
  # Most of errcheck is the `defer rows.Close()` class (126 rows.Close, 46
  # resp.Body.Close, 18 tx.Rollback), which is debt in the sense that matters
  # least. The worthwhile targets are the 24 Scan and 31 fmt.Sscanf findings,
  # where an error genuinely goes missing.
  #
  # Lower this as the debt is paid. It must never rise: a commit that adds a
  # finding fails the job even though the pre-existing debt is tolerated.
  LINT_BASELINE: "416"

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On main the linter needs history only for its own bookkeeping; on a
          # pull request the `new-from-merge-base` filter needs the base commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Prebuilt binaries for v2.1.6 are still built with go1.24 and refuse to
      # lint a go 1.26 module (exit 3). Build the same version with setup-go.
      # Building with the module's own toolchain also matters for the baseline:
      # a newer Go yields ~50 false `typecheck` errors that would inflate it.
      #
      # The action fails the step on any finding, which is what we want on a
      # pull request. On main the debt is expected, so the count is judged
      # against the baseline in the next step instead.
      - name: golangci-lint
        id: lint
        uses: golangci/golangci-lint-action@v8
        continue-on-error: true
        with:
          version: v2.1.6
          install-mode: goinstall
          args: --timeout=10m --output.text.path=lint-report.txt

      - name: Check findings against the baseline
        run: |
          # One line per finding, e.g. "path/file.go:12:5: message (linter)".
          count=$(grep -cE '^[a-z][^:]*\.go:[0-9]+' lint-report.txt || true)
          echo "findings on this commit: ${count} (baseline ${LINT_BASELINE})"
          # Also print the findings to the log. The step summary is not readable
          # from `gh run view --log`, so a failing job used to name a count with
          # no way to see which findings it meant.
          grep -E '^[a-z][^:]*\.go:[0-9]+' lint-report.txt || true

          if [ -f lint-report.txt ]; then
            {
              echo "### golangci-lint"
              echo "${count} finding(s); baseline ${LINT_BASELINE}."
              echo
              echo "<details><summary>Report</summary>"
              echo
              echo '```'
              head -200 lint-report.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${count}" -gt "${LINT_BASELINE}" ]; then
            echo "::error::${count} lint findings, above the baseline of ${LINT_BASELINE}."
            echo "This commit added findings. The pre-existing debt is tolerated, new debt is not."
            echo "Fix them, or if a finding is wrong, exclude it in .golangci.yml with a reason."
            exit 1
          fi

          if [ "${count}" -lt "${LINT_BASELINE}" ]; then
            echo "::notice::Findings dropped to ${count} from ${LINT_BASELINE}. Lower LINT_BASELINE in .github/workflows/lint.yml to lock the improvement in."
          fi

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Pre-existing debt (~600 no-explicit-any / hooks rules). Report without
      # failing the PR until a dedicated cleanup pass ratchets the count down.
      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: ESLint summary
        if: always()
        run: |
          echo "ESLint debt is non-blocking for now (see Phase B plan)."
          echo "Ratchet: fail CI when error count drops below a fixed threshold."
