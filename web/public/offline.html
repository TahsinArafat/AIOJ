<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIOJ - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f9fafb; color: #374151;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; color: #2563eb; margin-bottom: 0.5rem; }
    p { color: #6b7280; margin-bottom: 1.5rem; }
    button {
      background: #2563eb; color: white; border: none;
      padding: 0.75rem 1.5rem; border-radius: 0.5rem;
      font-size: 0.875rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }

    /* Dark mode — respects the OS preference since this page has no JS */
    @media (prefers-color-scheme: dark) {
      body { background: #1f2937; color: #f3f4f6; }
      h1 { color: #60a5fa; }
      p { color: #9ca3af; }
      button { background: #60a5fa; color: #1f2937; }
      button:hover { background: #93c5fd; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
