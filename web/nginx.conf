server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Declaring it lets nginx re-resolve `backend` at
    # request time instead of caching the IP from startup — without this the
    # container 502s forever if backend happened to be restarting when nginx
    # booted (a routine occurrence when the whole stack comes up together).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The SPA catch-all below would serve index.html for /sitemap.xml, which a
    # crawler would read as an HTML page. Route it to the backend, which builds
    # the XML from publicly visible problems, contests, and posts.
    location = /sitemap.xml {
        set $sitemap_upstream http://backend:8080;
        proxy_pass $sitemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ws {
        set $backend_ws http://backend:8080;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
