# Link-preview crawlers: the Facebook/Telegram/Slack family. They fetch the URL
# once and read the raw <head> — no JavaScript, no hydration — so the SPA's
# client-set page title ("Hello — AIOJ") never reaches them and every share
# showed the shell's default title with no image.
#
# Matches are requests to be answered by the server-rendered share card at
# /meta/<path> (internal/api/handler/meta.go), which is the same page with real
# Open Graph tags.
#
# Search engines are deliberately NOT listed. Googlebot and Bingbot do execute
# JavaScript, so they already see the correct title; handing them the meta
# document instead would also hand them a page with no app bundle and no
# statement text, which is a worse index entry, not a better one.
map $http_user_agent $aioj_link_preview_bot {
    default                    0;
    ""                         0;
    ~*facebookexternalhit      1;
    ~*facebot                  1;
    ~*twitterbot               1;
    ~*telegrambot              1;
    ~*whatsapp                 1;
    ~*slackbot                 1;
    ~*discordbot               1;
    ~*linkedinbot              1;
    ~*redditbot                1;
    ~*embedly                  1;
    ~*iframely                 1;
    ~*pinterest                1;
    ~*vkshare                  1;
    ~*skypeuripreview          1;
    ~*mastodon                 1;
    ~*cardyb                   1;  # Bluesky's unfurler
    ~*qwantify                 1;
    ~*nuzzel                   1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1 MB, which silently 413'd every upload over that size:
    # problem images (5 MB cap in the API) and test-case zips (100 MB cap) never
    # reached the backend. The API enforces the real per-route limits; this is
    # only the transport ceiling.
    client_max_body_size 128m;

    # Docker's embedded DNS. Declaring it lets nginx re-resolve `backend` at
    # request time instead of caching the IP from startup — without this the
    # container 502s forever if backend happened to be restarting when nginx
    # booted (a routine occurrence when the whole stack comes up together).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Long-running AI generation endpoints (synchronous legacy + job polling).
    # These calls can take 30–120 s; HTTP/1.1 keepalive prevents nginx from
    # dropping the upstream connection mid-response ("upstream prematurely
    # closed connection"), and the extended timeouts give the model room to
    # respond without a 502.
    location /api/generate/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/ai/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The SPA catch-all below would serve index.html for /sitemap.xml, which a
    # crawler would read as an HTML page. Route it to the backend, which builds
    # the XML from publicly visible problems, contests, and posts.
    location = /sitemap.xml {
        set $sitemap_upstream http://backend:8080;
        proxy_pass $sitemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same reason as /sitemap.xml: the SPA catch-all below would serve
    # index.html to a feed reader, which would see HTML instead of Atom.
    location = /feed/problems.atom {
        set $feed_upstream http://backend:8080;
        proxy_pass $feed_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt is served from the image's static root (web/public), but it is
    # declared explicitly so the intent is visible next to the other crawler
    # routes and it cannot be shadowed by the SPA catch-all below.
    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /feed/blog.atom {
        set $blogfeed_upstream http://backend:8080;
        proxy_pass $blogfeed_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed/contests.atom {
        set $contestfeed_upstream http://backend:8080;
        proxy_pass $contestfeed_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed/comments.atom {
        set $commentfeed_upstream http://backend:8080;
        proxy_pass $commentfeed_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ws {
        set $backend_ws http://backend:8080;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Prerendered legal pages are plain files: dist/legal/{privacy,terms,dmca}.html,
    # written by `npm run build` (web/src/prerender/legalEntry.tsx). `$uri.html`
    # is what serves them, and it serves the exact URL with no redirect — the
    # SPA catch-all would otherwise hand a crawler an empty index.html, which is
    # how the app-store review concluded the privacy policy had no content.
    rewrite ^/legal/(privacy|terms|dmca)/$ /legal/$1 permanent;

    # Every shared link's fallback preview image, and the one asset the preview
    # crawlers are guaranteed to fetch. Real files win over the share-card
    # branch below (`try_files` resolves before it), so this only adds caching.
    location = /og-default.png {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        # `$uri.html` serves the prerendered legal pages (see above). `$uri/` is
        # deliberately absent: with a `legal/` directory on disk it made a
        # request for /legal redirect to /legal/ and then 403. A SPA has no
        # directory-index routes, so the fallback is the SPA shell.
        #
        # That last fallback is a named location, not `/index.html`, because only
        # SPA routes are user-agent dependent: a real file on disk (an icon, the
        # manifest, the card image itself) must be served to every client,
        # including the crawlers that fetch it to build the preview.
        try_files $uri $uri.html @spa;
    }

    location @spa {
        # Social crawlers get the server-rendered share card instead of the SPA
        # shell. `return 418` plus `error_page` is the standard way to branch on
        # a variable from inside a location — a bare `if` cannot proxy, and
        # `try_files` cannot be conditional.
        error_page 418 = @link_preview;
        if ($aioj_link_preview_bot) {
            return 418;
        }
        try_files /index.html =404;
    }

    # Server-rendered metadata for a crawler: /problems/hello becomes
    # /meta/problems/hello on the backend, which answers with the problem's own
    # title, description, canonical URL and og:image.
    location @link_preview {
        set $meta_upstream http://backend:8080;
        # With a variable in proxy_pass nginx uses the string verbatim and does
        # no URI rewriting, so the original path is forwarded intact.
        proxy_pass $meta_upstream/meta$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
