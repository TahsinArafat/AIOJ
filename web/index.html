<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta id="theme-color-meta" name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AIOJ" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="AIOJ is an online judge for competitive programming: solve problems, join contests, and track your rating."
    />

    <!--
      Link previews. The crawlers behind them (Telegram, Slack, Discord,
      WhatsApp, X, LinkedIn, Facebook) do not run JavaScript, so the per-page
      title the app sets at runtime is invisible to them — every share used to
      show "AIOJ — Online Judge" over a solid colour block.

      Per-problem cards are now server-rendered at /meta/<path> by
      internal/api/handler/meta.go, and nginx sends social crawlers there. These
      tags are the fallback for every route that has no entity of its own.

      The image URLs start with the SITE_ORIGIN placeholder, filled in at build
      time from PUBLIC_ORIGIN (see vite.config.ts): og:image must be absolute
      for every platform. No canonical tag
      here on purpose — the SPA answers every route from this one file, so a
      static canonical would tell search engines that all pages are duplicates
      of whichever URL it named.
    -->
    <meta property="og:site_name" content="AIOJ" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AIOJ — Online Judge" />
    <meta
      property="og:description"
      content="AIOJ is an online judge for competitive programming: solve problems, join contests, and track your rating."
    />
    <meta property="og:image" content="%SITE_ORIGIN%/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AIOJ — Online Judge" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIOJ — Online Judge" />
    <meta
      name="twitter:description"
      content="AIOJ is an online judge for competitive programming: solve problems, join contests, and track your rating."
    />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-default.png" />

    <title>AIOJ — Online Judge</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1f2937' : '#2563eb');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js');
      }
    </script>
  </body>
</html>
